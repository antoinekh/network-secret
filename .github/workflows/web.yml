name: web

# Svelte site under web/ only. Cloudflare Pages does the deploy; this just
# gates the same checks the site's CLAUDE.md requires before pushing.
on:
  push:
    branches: [master]
    paths:
      - "web/**"
      - ".github/workflows/web.yml"
  pull_request:
    paths:
      - "web/**"
      - ".github/workflows/web.yml"

defaults:
  run:
    working-directory: web

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Unit tests
        run: npm test
      - name: Type check
        run: npm run check
      - name: Build
        run: npm run build
