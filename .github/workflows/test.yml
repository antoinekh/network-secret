name: tests

# Python package only. The Svelte site under web/ has its own workflow, so
# site-only commits must not run pytest (and vice versa).
on:
  push:
    branches: [master]
    paths:
      - "network_secret/**"
      - "tests/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/test.yml"
  pull_request:
    paths:
      - "network_secret/**"
      - "tests/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/test.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v6
      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: false
      - name: Run tests
        run: uv run --python ${{ matrix.python-version }} pytest -v
